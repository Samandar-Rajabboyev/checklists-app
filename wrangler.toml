name = "todo"
main = "worker/src/index.ts"
compatibility_date = "2026-10-20"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Without this, browser *navigations* to /api/* (the OAuth login links and
# the provider's redirect back to /api/auth/callback/*) are answered by the
# SPA fallback with index.html and never reach the Worker.
run_worker_first = ["/api/*"]

[[routes]]
pattern = "todo.samandar.dev"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "todo-db"
database_id = "1860eeb9-030c-4855-aa42-a344d29feda6"
migrations_dir = "worker/migrations"

# Set via `wrangler secret put GOOGLE_CLIENT_SECRET` / `GITHUB_CLIENT_SECRET` (not committed).
[vars]
GOOGLE_CLIENT_ID = "109945548306-763jpc7nbb1c6vv5rid9qut0rsb96eu7.apps.googleusercontent.com"
GITHUB_CLIENT_ID = "Ov23liv96sbFUuQe5xNX"
PUBLIC_URL = "https://todo.samandar.dev"
