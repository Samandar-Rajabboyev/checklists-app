name = "todo"
main = "worker/src/index.ts"
compatibility_date = "2026-10-20"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[routes]]
pattern = "todo.samandar.dev"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "todo-db"
database_id = "1860eeb9-030c-4855-aa42-a344d29feda6"
migrations_dir = "worker/migrations"

# Set via `wrangler secret put GOOGLE_CLIENT_SECRET` / `GITHUB_CLIENT_SECRET` (not committed).
# Set via `wrangler secret put SESSION_SECRET` for cookie signing.
[vars]
GOOGLE_CLIENT_ID = ""
GITHUB_CLIENT_ID = ""
PUBLIC_URL = "https://todo.samandar.dev"
